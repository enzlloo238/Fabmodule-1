<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>

<style>
body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    height:100vh;
    font-family:Arial;
    color:white;
}

canvas{
    background:black;
    border:4px solid lime;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
    border:none;
    background:lime;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#00cc00;
}
</style>
</head>

<body>

<h1>Snake Game</h1>
<canvas id="game" width="300" height="300"></canvas>
<button onclick="restartGame()">Restart Game</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;
let snake;
let food;
let dx;
let dy;
let score;
let gameLoop;

function startGame(){

snake = [{x:200,y:200}];
dx = grid;
dy = 0;
score = 0;

food = {
x: Math.floor(Math.random()*20)*grid,
y: Math.floor(Math.random()*20)*grid
};

if(gameLoop) clearInterval(gameLoop);
gameLoop = setInterval(drawGame,120);

}

document.addEventListener("keydown", changeDirection);

function changeDirection(e){

if(e.key === "ArrowLeft" && dx === 0){
dx = -grid;
dy = 0;
}

if(e.key === "ArrowUp" && dy === 0){
dx = 0;
dy = -grid;
}

if(e.key === "ArrowRight" && dx === 0){
dx = grid;
dy = 0;
}

if(e.key === "ArrowDown" && dy === 0){
dx = 0;
dy = grid;
}

}

function drawGame(){

ctx.fillStyle = "black";
ctx.fillRect(0,0,300,300);

let head = {x: snake[0].x + dx, y: snake[0].y + dy};

if(
head.x < 0 || head.y < 0 ||
head.x >= 300 || head.y >= 300 ||
snake.some(part => part.x === head.x && part.y === head.y)
){
clearInterval(gameLoop);
ctx.fillStyle="white";
ctx.font="30px Arial";
ctx.fillText("Game Over",130,200);
return;
}

snake.unshift(head);

if(head.x === food.x && head.y === food.y){

score++;

food = {
x: Math.floor(Math.random()*20)*grid,
y: Math.floor(Math.random()*20)*grid
};

}else{
snake.pop();
}

ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,grid,grid);

ctx.fillStyle="lime";
snake.forEach(part=>{
ctx.fillRect(part.x,part.y,grid,grid);
});

ctx.fillStyle="white";
ctx.font="18px Arial";
ctx.fillText("Score: "+score,10,20);

}

function restartGame(){
startGame();
}

startGame();

</script>

</body>
</html>
