<html>
    <head>
        <title> 
            Student Records with Media
        </title>
    </head>
    <body style="background-color: rgb(245, 245, 245);">

        <h2> Sasuke Uchiha </h2>

      
        <figure>
            <img src="https://m.media-amazon.com/images/I/71BQOludsuL._AC_UF894,1000_QL80_.jpg" alt="Sasuke Uchiha" style="width: 300px;">
            <figcaption> Sasuke Uchiha - The Last of the Uchiha Clan. </figcaption>
        </figure>

        <br><br>

        <h2> Listen to Sasuke's Theme </h2>
        <audio controls>

            Your browser does not support the audio element.
        </audio>

        <br><br>

        <h2> Student Records </h2>
        <table class="students" border="1" cellpadding="10">

                <tr>
                    <th> Student Name </th>
                    <th> Age </th>

                    <th> Country </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td> John Doe </td>
                    <td> 20 </td>
                    <td> A </td>
                    <td> USA </td>
                </tr>
                <tr>
                    <td> Sarah Lee </td>
                    <td> 22 </td>
                    <td> B+ </td>
                    <td> Canada </td>
                </tr>
                <tr>
                    <td> Mike Smith </td>
                    <td> 21 </td>
                    <td> B </td>
                    <td> UK </td>
                </tr>
                <tr>
                    <td> Emily Davis </td>
                    <td> 23 </td>
                    <td> A- </td>
                    <td> Australia </td>
                </tr>
                <tr>
                    <td> David Clark </td>
                    <td> 24 </td>
                    <td> A </td>
                    <td> India </td>
                </tr>
            </tbody>
        </table>

    </body>

</html>

<style>
    body {
        font-family: Arial, sans-serif;
    }

    figure {

        color: #555;
    }

    table {
