<!DOCTYPE html>

    <head>
       
        <title>simple form</title>
       
    </head>
    <body>
        <center>
      <form>
        <form action="#" method="post" enctype="multipart/form-data"></form>
      </form>
<br><br>
      Name:
      <input type="text" name="your name" placeholder="enter your full name">
<br><br>
      Number:
      <input type="tel" name="number" pattern="[0-9][10]" placeholder="enter your mobile number">
<br><br>
      Date of Birth:
      <input type="date" name="dob">
      <br><br>
      Your Email:
      <input type="text" name="email" placeholder="enter your name">
<br><br>
     
      <br><br>


        </center>
    </body>
</html>
