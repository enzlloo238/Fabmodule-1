<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updated Squares Layout</title>

    <style>
        .square {
            width: 1000px;
            height: 500px;
            /* Changed border color to a vibrant purple */
            border: 5px solid #8A2BE2; 
            padding: 20px;
            margin: 40px auto;
            /* Added white text color so it shows up on the dark background */
            color: white; 

            /* New Space background image */
            background-image: url('https://picsum.photos/id/1043/1000/500');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;

            display: flex;
            /* Added gap to space out the inner squares nicely */
            gap: 20px; 
        }

        .sq2 {
            width: 200px;
            height: 200px;
            /* Changed border color to a bright orange-red */
            border: 5px solid #FF4500; 
            padding: 20px;
            margin: 40px auto;
            /* Added a yellow text color */
            color: #FFDF00; 
            font-weight: bold;

            /* New Valley/River background image */
            background-image: url('https://picsum.photos/id/1015/200/200');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .sq3 {
            width: 200px;
            height: 200px;
            /* Changed border color to a bright spring green */
            border: 5px solid #00FF7F; 
            padding: 20px;
            margin: 40px auto;
            /* Added a light cyan text color */
            color: #E0FFFF; 
            font-weight: bold;

            /* New Mountain background image */
            background-image: url('https://picsum.photos/id/1016/200/200');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <div class="square">
        <div>
            <h1> Space Theme</h1>
            <p> This is the main container </p>
        </div>
        
        <div class="sq2">
            <h1> </h1><br><br><br><br><br><br><br>
            <p> Box 1 </p>
        </div>

        <div class="sq3">
            <h1>  </h1>
            <p> Box 2 </p><br><br><br><br><br><br>
        </div>
    </div>
</body>
</html>
